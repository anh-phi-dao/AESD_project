# Self-hosted broker for the smart lock. See docs/mqtt_protocol.md.
# Paths assume the eclipse-mosquitto Docker image with ./ mounted at /mosquitto/config.

per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/

# Device: MQTT over TLS.
listener 8883
protocol mqtt
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key

# Web page: MQTT over secure WebSocket. Pages served over HTTPS can only use wss://.
listener 8884
protocol websockets
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key

# Voice chunks are 4 KB + 16-byte header; anything much larger is not ours.
max_packet_size 8192
